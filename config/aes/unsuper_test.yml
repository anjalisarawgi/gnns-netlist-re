sampling_method: graphsaint_rw
model: DirectedOnlyGAT
epochs: 1000
# walk_length: 20
# perc_batchsize: 0.01
set_gradient_clipping: true
normalize_class_weights: true
reduction_method_cel: "mean"
lr: 0.001
loss_type : "ce_soft" #ce_weighted #ce_soft
sample_coverage : 50
training_mode: "fullgraph"
fullgraph_mode: "per_design"
# use_unsupervised_features: true
use_unsupervised_features_louvian: true

